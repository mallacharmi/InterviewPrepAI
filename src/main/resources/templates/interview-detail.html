<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Interview Details')}"></head>
<body>
    <div th:replace="~{layout :: nav}"></div>
    
    <!-- Forward to report page since they serve similar purposes for completed interviews -->
    <!-- This file is maintained for routing flexibility if distinct detail view is needed -->
    <main class="container my-4">
        <div class="flex justify-between align-center mb-4">
            <h2>Interview Details</h2>
            <a th:href="@{/interviews/history}" class="btn btn-outline">Back to History</a>
        </div>
        
        <div class="alert alert-info">
            <p>Redirecting to report view...</p>
            <script th:inline="javascript">
                window.location.href = '/interviews/' + /*[[${interview.id}]]*/ '0' + '/report';
            </script>
        </div>
    </main>
    
    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
