server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: ai-interview-prep

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# AI Configuration
ai:
  api-key: ${AI_API_KEY:}
  api-url: ${AI_API_URL:https://api.openai.com/v1/chat/completions}
  model: ${AI_MODEL:gpt-3.5-turbo}
  timeout: ${AI_TIMEOUT:30}
  max-retries: ${AI_MAX_RETRIES:3}
  max-follow-ups: ${AI_MAX_FOLLOW_UPS:1}

# Logging
logging:
  level:
    com.interviewprep: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
